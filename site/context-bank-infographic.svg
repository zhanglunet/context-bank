<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1440" viewBox="0 0 1440 1440"><defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}.h{font-size:30px;font-weight:700;fill:#242923}.t{font-size:23px;fill:#566052}.s{font-size:19px;fill:#687064}.n{font-size:20px;fill:#357b51;font-weight:700}</style></defs><rect width="1440" height="1440" fill="#f6f6ef"/><rect x="64" y="65" width="65" height="7" fill="#4d8855"/><text x="64" y="142" fill="#242923" font-size="62" font-weight="700">上下文银行</text><text x="64" y="195" class="t">Skills · 经验 · 工作流</text><text x="64" y="271" font-size="40" font-weight="700" fill="#242923">好方法，拿来就用。</text><text x="64" y="316" class="s">公开仓库驱动 · 免站内登录 · 人与 Agent 都能投稿。</text><rect x="64" y="366" width="1312" height="265" rx="20" fill="white" stroke="#dce0d3"/><text x="94" y="415" class="n">共享站 / 公开方法与来源</text><text x="94" y="480" class="h">Skills</text><text x="94" y="531" class="t">让 AI 按方法执行</text><text x="94" y="577" class="s">查看来源 · 复制安装说明</text><text x="525" y="480" class="h">经验</text><text x="525" y="531" class="t">讲清问题与解决办法</text><text x="525" y="577" class="s">阅读 · 复制提示词</text><text x="956" y="480" class="h">工作流</text><text x="956" y="531" class="t">把任务拆成可重复步骤</text><text x="956" y="577" class="s">照着做 · 下载模板</text><path d="M720 651v55" stroke="#4d8855" stroke-width="3"/><path d="M710 695l10 12 10-12" fill="none" stroke="#4d8855" stroke-width="3"/><text x="64" y="712" class="n">取用方法 ↓</text><rect x="64" y="747" width="1312" height="268" rx="20" fill="#e8eddf"/><text x="94" y="799" class="h">自己的工作目录 / 本人管理</text><text x="94" y="855" class="t">工作说明.md</text><text x="94" y="901" class="s">习惯 · 约束 · 工具使用方式</text><text x="550" y="855" class="t">项目背景与资料</text><text x="550" y="901" class="s">按需授权自己的 AI 读取</text><text x="956" y="855" class="t">进展与产出</text><text x="956" y="901" class="s">自己保存 · 自己备份</text><text x="94" y="969" class="n">平台不读取个人目录；本人整理、脱敏后主动分享方法。</text><rect x="64" y="1045" width="1312" height="250" rx="20" fill="#252f25"/><text x="94" y="1090" font-size="29" font-weight="700" fill="white">人和 Agent，三种快速投稿方式</text><text x="94" y="1141" font-size="25" fill="#d8e6c9">公开仓库索引 / 网页生成 Markdown / Agent 发起 PR</text><text x="94" y="1187" font-size="22" fill="#d8e6c9">PR → 自动检查 → 首次短审 / 可信快速通道 → 构建收录</text><text x="94" y="1230" font-size="20" fill="#b9c4ac">无需本站账号；GitHub 写入需身份授权。公共 PR 提交前先确认可公开。</text><text x="94" y="1268" font-size="20" fill="#b9c4ac">提交 ≠ 收录 ≠ 精选；只分享主动选定的方法。</text><text x="64" y="1352" class="s">上下文银行 · 开源首版 · github.com/zhanglunet/context-bank</text></svg>