name: Trusted content
on:
  workflow_run:
    workflows: [Check]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            for (const link of run.pull_requests) {
              const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: link.number});
              if (pr.state !== 'open' || pr.draft || pr.head.sha !== run.head_sha || pr.base.ref !== 'main') continue;
              const {data: policy} = await github.rest.repos.getContent({...context.repo, path: '.github/trusted-authors.json', ref: 'main'});
              const authors = JSON.parse(Buffer.from(policy.content, 'base64').toString());
              if (!authors.includes(pr.user.login)) continue;
              const files = await github.paginate(github.rest.pulls.listFiles, {...context.repo, pull_number: pr.number, per_page: 100});
              if (!files.length || files.length > 100 || !files.every(f => /^(content\/(notes|workflows)\/[a-z0-9-]+\.md|registry\/[a-z0-9-]+\.json)$/.test(f.filename))) continue;
              // A policy-sensitive diff always needs a maintainer, even for trusted authors.
              if (files.some(f => /(?:license|permission|https?:\/\/)/i.test(f.patch || ''))) continue;
              await github.rest.pulls.merge({...context.repo, pull_number: pr.number, sha: pr.head.sha, merge_method: 'squash'});
            }
